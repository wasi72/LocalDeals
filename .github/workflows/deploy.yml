name: Build & Verify CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Initialize & Push SQLite Database Schema
        env:
          DATABASE_URL: "file:./dev.db"
        run: npx prisma db push --skip-generate

      - name: Seed Database
        env:
          DATABASE_URL: "file:./dev.db"
        run: node prisma/seed.js

      - name: Run Automated Test Suite
        env:
          DATABASE_URL: "file:./dev.db"
          HMAC_SECRET: "ci-test-secret-32-chars-long-localdeals"
        run: npm test

      - name: Build Next.js Production App
        env:
          DATABASE_URL: "file:./dev.db"
          HMAC_SECRET: "ci-test-secret-32-chars-long-localdeals"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: npm run build
